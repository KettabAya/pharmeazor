<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" width="760" height="210" role="img" aria-label="Pharmeazor">
  <title>Pharmeazor</title>
  <defs>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2DE2F0" stop-opacity=".60"/>
      <stop offset="60%" stop-color="#3E8BFF" stop-opacity=".32"/>
      <stop offset="100%" stop-color="#8B7BF7" stop-opacity=".18"/>
    </linearGradient>
    <radialGradient id="seam">
      <stop offset="0%" stop-color="#C9FBFF" stop-opacity="1"/>
      <stop offset="55%" stop-color="#2DE2F0" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#2DE2F0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0E2552" stop-opacity="1"/>
      <stop offset="100%" stop-color="#060D1F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="760" height="210" rx="22" fill="#060D1F"/>
  <ellipse cx="150" cy="105" rx="210" ry="150" fill="url(#halo)"/>

  <!-- plexus hint -->
  <g stroke="#2DE2F0" stroke-width="1" opacity=".22" fill="none">
    <path d="M598 44 L664 70 L706 40 M664 70 L652 128 L706 160 M652 128 L592 150 M598 44 L592 150"/>
  </g>
  <g fill="#8FF2FB" opacity=".5">
    <circle cx="598" cy="44" r="2.6"/><circle cx="664" cy="70" r="2.2"/>
    <circle cx="706" cy="40" r="2"/><circle cx="652" cy="128" r="2.6"/>
    <circle cx="706" cy="160" r="2"/><circle cx="592" cy="150" r="2.2"/>
  </g>

  <!-- capsule mark -->
  <g transform="translate(90 105) rotate(-34) scale(0.78)">
    <g transform="translate(-4 -6)">
      <polygon points="-22,-2 -22,-24 -20.3,-32.4 -15.6,-39.6 -8.4,-44.3 0,-46 8.4,-44.3 15.6,-39.6 20.3,-32.4 22,-24 22,-2"
               fill="none" stroke="#2DE2F0" stroke-width="2.1" stroke-linejoin="round"/>
      <path d="M0,-22 L-22,-2 M0,-22 L-22,-24 M0,-22 L-15.6,-39.6 M0,-22 L0,-46 M0,-22 L15.6,-39.6 M0,-22 L22,-24 M0,-22 L22,-2 M0,-8 L-22,-2 M0,-8 L22,-2 M0,-8 L0,-22"
            fill="none" stroke="#3E8BFF" stroke-width=".9" opacity=".55"/>
      <g fill="#8FF2FB">
        <circle cx="-22" cy="-24" r="2.1"/><circle cx="-15.6" cy="-39.6" r="1.9"/>
        <circle cx="0" cy="-46" r="2.3"/><circle cx="15.6" cy="-39.6" r="1.9"/>
        <circle cx="22" cy="-24" r="2.1"/><circle cx="0" cy="-22" r="2.5"/>
      </g>
    </g>
    <g transform="translate(4 6)">
      <polygon points="-22,2 -22,24 -20.3,32.4 -15.6,39.6 -8.4,44.3 0,46 8.4,44.3 15.6,39.6 20.3,32.4 22,24 22,2"
               fill="url(#cap)" stroke="#2DE2F0" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M0,2 L-22,24 M0,2 L0,46 M0,2 L22,24" fill="none" stroke="#3E8BFF" stroke-width=".9" opacity=".45"/>
    </g>
    <ellipse cx="0" cy="0" rx="34" ry="10" fill="url(#seam)"/>
  </g>

  <!-- wordmark -->
  <text x="188" y="106" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif"
        font-size="58" font-weight="700" letter-spacing="-1.6" fill="#EAF4FF">Pharme<tspan fill="#2DE2F0">azor</tspan></text>
  <text x="190" y="142" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif"
        font-size="19" font-weight="400" letter-spacing=".4" fill="#9FB6D6">« Chaque réponse, sa source. »</text>
  <rect x="190" y="156" width="206" height="1.5" fill="#2DE2F0" opacity=".5"/>
</svg>
