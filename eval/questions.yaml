# Evaluation set. Target: at least 30 questions, replayable in one command.
#
# Each entry carries the expected answer AND the reference passage, so a run
# measures citation correctness, not just answer plausibility.
#
#   level 1  - direct: the answer sits in a single document
#   level 2  - crossed: the answer needs several sources reconciled
#   level 3  - patient context: precautions for a given profile
#   trap     - the system must flag, not guess
#   refusal  - out of scope; the system must decline

questions:
  - id: Q001
    level: 1
    question: "Quel est le dosage disponible de [medicament] ?"
    expected_answer: "TODO"
    reference_passage: "TODO"
    reference_source: nomenclature

